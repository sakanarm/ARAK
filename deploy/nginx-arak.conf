# ARAK behind the shared nginx, routed by path prefix.
#
# This file lives in the application's own directory, not in /etc/nginx, so that
# changing how ARAK is routed never means editing a file other applications
# share. /etc/nginx is touched exactly once, to add:
#
#     include /home/<user>/Arak/deploy/nginx-arak.conf;
#
# inside the existing `server { ... }` block, then:
#
#     sudo nginx -t && sudo systemctl reload nginx
#
# The include needs the full path. nginx does not expand "~".

# Without this, /Arak (no trailing slash) resolves relative links against "/".
location = /Arak { return 301 /Arak/; }

location /Arak/ {
    # The trailing slash on proxy_pass is what strips the /Arak prefix, so the
    # application sees "/" and "/api/..." and needs no knowledge of where it is
    # mounted. The front-end bundle does need that knowledge -- it builds URLs
    # in the browser, where the prefix is still there -- which is why it is
    # built with VITE_BASE=/Arak/ and why the service logs an error at startup
    # when the bundle and APP_WEB_BASE_PATH disagree.
    proxy_pass http://127.0.0.1:8090/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /Arak;
    proxy_set_header Connection        "";

    # Query results stream. Buffering them would hold a long result set in
    # nginx and hand the user nothing until it finished.
    proxy_buffering off;
    proxy_cache     off;
    chunked_transfer_encoding off;

    # A policy applied against a large table, or a crawl of a whole catalog,
    # can outlast a default 60s read timeout.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 50m;
}
