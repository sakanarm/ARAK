name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and unit test
        run: ./mvnw -B verify -DskipITs
      - name: Fail if generated sources were committed
        # Both generators write into gitignored directories. A generated file in
        # a diff means someone edited output instead of the schema, and the next
        # build silently reverts their change.
        run: |
          if git ls-files --error-unmatch 'backend/*/src/main/generated/*' >/dev/null 2>&1; then
            echo "Generated sources are committed. Edit the JSON Schema instead."
            exit 1
          fi

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: yarn
          cache-dependency-path: frontend/app/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Generate types from the shared JSON Schema
        run: yarn parse-schema
      - run: yarn type-check
      - run: yarn lint
      - run: yarn test --passWithNoTests
      - run: yarn build

  design-system-drift:
    name: Vendored design system untouched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject hand edits to frontend/ui-core-components
        # The directory is a vendored copy of OpenMetadata at a pinned tag
        # (Apache-2.0). Editing it in place looks fine until the next resync
        # wipes it, so overrides belong in frontend/app/src/theme instead.
        # Legitimate resyncs update VENDORED.md in the same commit.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || exit 0
          changed=$(git diff --name-only "$base"...HEAD -- frontend/ui-core-components | grep -v 'VENDORED.md' || true)
          if [ -n "$changed" ] && ! git diff --name-only "$base"...HEAD -- frontend/ui-core-components/VENDORED.md | grep -q .; then
            echo "Vendored files changed without a VENDORED.md update:"
            echo "$changed"
            exit 1
          fi

  secrets:
    name: No secrets in the change
    # The repository has been public, so a secret that lands in a commit is
    # out even if a later commit removes it. Only the commits this push or pull
    # request adds are scanned; the history before it was scanned once by hand
    # and its one fake token is in .gitleaksignore.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks, checked against its published checksum
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan the commits this change adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="$PUSH_AFTER"
          fi
          echo "Scanning $range"
          ./gitleaks git --no-banner --redact --log-opts="$range" .

  integration:
    name: Integration (Testcontainers)
    # Real PostgreSQL and SQL Server, because generated DDL that only passes
    # against a mock proves nothing (NFR-5). Kept off every push: it is slow,
    # and the unit suite already covers the compilers through golden files.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify -Pintegration
