# Data Access Control Platform — Dropwizard configuration.
#
# Every ${VAR} is substituted from the environment at startup. This file is
# committed; secrets are not. Copy .env.example to .env and fill it in.
#
# Substitution happens on the text, before YAML reads it, so every free-text
# value is in double quotes: a password that starts with "@", or a token with
# ": " in it, is otherwise a YAML syntax error and the service will not start.
# The one thing a quoted value cannot contain is a double quote or a backslash.

server:
  applicationConnectors:
    - type: http
      port: ${APP_PORT:-8080}
  adminConnectors:
    - type: http
      port: ${APP_ADMIN_PORT:-8081}
      # Loopback only. The admin port has no authentication -- it runs a GC and
      # changes log levels for whoever asks -- and on a shared host every other
      # machine that can reach the box could otherwise ask.
      bindHost: "${APP_ADMIN_BIND_HOST:-127.0.0.1}"
  rootPath: /api/*
  requestLog:
    appenders:
      - type: console

logging:
  level: INFO
  loggers:
    com.mfec.dac: DEBUG
    org.flywaydb: INFO
  appenders:
    - type: console

database:
  driverClass: org.postgresql.Driver
  url: "jdbc:postgresql://${APP_DB_HOST:-localhost}:${APP_DB_PORT:-5432}/${APP_DB_NAME:-dac}"
  user: "${APP_DB_USER:-dac}"
  password: "${APP_DB_PASSWORD:-}"
  properties:
    charSet: UTF-8
  maxWaitForConnection: 5s
  validationQuery: "SELECT 1"
  # Every connection held here is one the database cannot give to anyone else.
  # Where the server is shared with other applications, set these low in .env:
  # the ceiling is theirs as much as ours.
  initialSize: ${APP_DB_POOL_MIN:-4}
  minSize: ${APP_DB_POOL_MIN:-4}
  maxSize: ${APP_DB_POOL_MAX:-32}
  checkConnectionWhileIdle: true

migrateOnStartup: ${APP_DB_MIGRATE_ON_STARTUP:-true}

# Serving the built front end from this same process. Left empty in
# development, where Vite serves it and proxies /api here. Set on a deployment
# that runs one process on one port behind a shared proxy -- there is nothing
# else there to serve it.
web:
  root: "${APP_WEB_ROOT:-}"
  # What the bundle was built for. Behind a path-prefix proxy that strips the
  # prefix, this process never sees it; it is here so startup can say so when
  # the bundle and the mount point disagree, instead of serving a blank page.
  basePath: "${APP_WEB_BASE_PATH:-/}"

openMetadata:
  baseUrl: "${OM_BASE_URL:-http://localhost:8585}"
  # Use a BOT token (Settings -> Bots in the OpenMetadata UI), not a human account.
  jwtToken: "${OM_JWT_TOKEN:-}"
  expectedVersion: "${OM_EXPECTED_VERSION:-2.0.1}"
  # Turn this on once the deployment is pinned: the generated client is built
  # from one spec version and talking to another drifts silently.
  failOnVersionMismatch: ${OM_FAIL_ON_VERSION_MISMATCH:-false}
  # Shared secret on the OpenMetadata event subscription that pushes to
  # POST /v1/webhooks/openmetadata. Leave it unset and the receiver answers 503
  # rather than trusting unsigned deliveries -- it is that endpoint's only
  # authentication.
  webhookSecret: "${OM_WEBHOOK_SECRET:-}"
  # The pull side of FR-1.5, and what makes a missed webhook a delay rather than
  # a permanently wrong cache. It is also the whole sync mechanism where nobody
  # registered a subscription.
  pollEnabled: ${OM_POLL_ENABLED:-true}
  pollIntervalSeconds: ${OM_POLL_INTERVAL_SECONDS:-60}
  maxEventsPerPoll: ${OM_MAX_EVENTS_PER_POLL:-2000}
  # The nightly full crawl. It catches what no event describes: a classification
  # becoming mutually exclusive, a domain gaining a parent, an asset deleted
  # while this service was down.
  reconcileEnabled: ${OM_RECONCILE_ENABLED:-true}
  reconcileAt: "${OM_RECONCILE_AT:-02:30}"
  reconcileZone: "${OM_RECONCILE_ZONE:-Asia/Bangkok}"

identity:
  entraTenantId: "${ENTRA_TENANT_ID:-}"
  entraClientId: "${ENTRA_CLIENT_ID:-}"
  entraClientSecret: "${ENTRA_CLIENT_SECRET:-}"
  # Microsoft sign-in (FR-2.1). One app registration shared by several
  # applications. All four must be set for the button to appear. The redirect
  # URI is https://<host>/<base path>/api/auth/callback/microsoft-entra-id and
  # must be registered on the app registration exactly as written.
  entraLoginTenantId: "${ENTRA_LOGIN_TENANT_ID:-}"
  entraLoginClientId: "${ENTRA_LOGIN_CLIENT_ID:-}"
  entraLoginClientSecret: "${ENTRA_LOGIN_CLIENT_SECRET:-}"
  entraLoginRedirectUri: "${ENTRA_LOGIN_REDIRECT_URI:-}"
  entraLoginButtonLabel: "${ENTRA_LOGIN_BUTTON_LABEL:-Sign in with Microsoft}"
  # The shared auth service asked whether a person may use ARAK at all. Unset
  # means ARAK's own accounts and roles decide alone.
  authServiceUrl: "${AUTH_SERVICE_URL:-}"
  authServiceApiKey: "${AUTH_SERVICE_API_KEY:-}"
  allowLocalUsers: ${IDENTITY_ALLOW_LOCAL_USERS:-true}
  attributeCacheTtlSeconds: 300
  # Console session token. No default on purpose: the app refuses to start
  # without it rather than sign tokens with a key that is in this repository.
  # Generate one with: openssl rand -base64 48
  jwtSecret: "${IDENTITY_JWT_SECRET:-}"
  jwtIssuer: "${IDENTITY_JWT_ISSUER:-data-access-control}"
  jwtTtlSeconds: ${IDENTITY_JWT_TTL_SECONDS:-3600}
  maxFailedLoginAttempts: ${IDENTITY_MAX_FAILED_LOGIN_ATTEMPTS:-5}
  lockoutSeconds: ${IDENTITY_LOCKOUT_SECONDS:-900}
  # Applied to the seeded admin account on first start only, and only while no
  # local credential exists at all.
  bootstrapAdminPassword: "${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:-}"

decisionCache:
  # Reuse of access decisions (FR-5.5). Turning this off costs three database
  # reads per decision and is the first thing to try when a decision looks
  # stale and nobody can say why.
  enabled: ${DECISION_CACHE_ENABLED:-true}
  maxEntries: ${DECISION_CACHE_MAX_ENTRIES:-50000}
  # The ceiling on how long a decision can outlive a change nothing announced --
  # including a change made by another instance of this service, whose flush
  # this one never hears.
  ttlSeconds: ${DECISION_CACHE_TTL_SECONDS:-60}

resultCache:
  # Reuse of Query API results (FR-6.3). Keyed on the enforced statement, so it
  # never crosses a decision; bounded in age by ttlSeconds alone, because the
  # source never says when its rows change.
  enabled: ${RESULT_CACHE_ENABLED:-true}
  maxEntries: ${RESULT_CACHE_MAX_ENTRIES:-500}
  # Rows times columns across every held result; one result may use a quarter.
  maxCells: ${RESULT_CACHE_MAX_CELLS:-1000000}
  ttlSeconds: ${RESULT_CACHE_TTL_SECONDS:-30}

queryLimits:
  # How many Query API reads may be out at the sources at once (FR-6.3). Each
  # one is a connection to somebody else's database, so maxPerSource stays well
  # under what a shared server allows. A statement with no room waits
  # queueWaitMillis and is then refused as busy (429); cached answers and
  # refusals never take a slot.
  enabled: ${QUERY_LIMITS_ENABLED:-true}
  maxConcurrent: ${QUERY_MAX_CONCURRENT:-16}
  maxPerSource: ${QUERY_MAX_PER_SOURCE:-4}
  maxPerCaller: ${QUERY_MAX_PER_CALLER:-2}
  queueWaitMillis: ${QUERY_QUEUE_WAIT_MS:-3000}
  # The source's planner prices each statement, row cap included, before it is
  # sent; one priced over its engine's ceiling is refused. Planner units, not
  # seconds, and different per engine. 0 switches the guard off for an engine.
  costGuard: ${QUERY_COST_GUARD_ENABLED:-true}
  maxCostPostgres: ${QUERY_MAX_COST_POSTGRES:-10000000}
  maxCostSqlServer: ${QUERY_MAX_COST_SQLSERVER:-5000}
  # MySQL's figure ignores a row limit, so only a download of every row is
  # priced there; a read for the screen runs under its timeout alone.
  maxCostMySql: ${QUERY_MAX_COST_MYSQL:-10000000}
  # A download of every row streams as it is read and holds a source
  # connection until the last row; it is stopped, and audited as failed, if it
  # runs longer than this.
  exportTimeoutSeconds: ${QUERY_EXPORT_TIMEOUT_SECONDS:-600}

gateway:
  # The ARAK Gateway (FR-19): a PostgreSQL port in front of the query proxy, so
  # DBeaver, Power BI, Excel and psql read as the person signed in. Off unless
  # GATEWAY_ENABLED is true. The password a client sends is a personal access
  # token (POST /api/v1/me/tokens), never the person's own password.
  enabled: ${GATEWAY_ENABLED:-false}
  bindHost: "${GATEWAY_BIND_HOST:-127.0.0.1}"
  port: ${GATEWAY_PORT:-5439}
  # PKCS#12 holding the server certificate and key; the password is a
  # credential reference (env:NAME holding user:password, fernet:, vault://).
  keyStorePath: "${GATEWAY_KEYSTORE_PATH:-}"
  keyStorePassword: "${GATEWAY_KEYSTORE_PASSWORD_REF:-}"
  # A client that does not ask for TLS is turned away before it sends a token.
  # Turn off only for a trial on one machine.
  requireTls: ${GATEWAY_REQUIRE_TLS:-true}
  maxConnections: ${GATEWAY_MAX_CONNECTIONS:-64}
  maxConnectionsPerUser: ${GATEWAY_MAX_CONNECTIONS_PER_USER:-8}
  authTimeoutSeconds: ${GATEWAY_AUTH_TIMEOUT_SECONDS:-30}
  idleTimeoutSeconds: ${GATEWAY_IDLE_TIMEOUT_SECONDS:-1800}
  maxRows: ${GATEWAY_MAX_ROWS:-100000}
  statementTimeoutSeconds: ${GATEWAY_STATEMENT_TIMEOUT_SECONDS:-120}
  maxFailuresPerAddress: ${GATEWAY_MAX_FAILURES_PER_ADDRESS:-10}
  failureWindowSeconds: ${GATEWAY_FAILURE_WINDOW_SECONDS:-900}
  maxTokenDays: ${GATEWAY_MAX_TOKEN_DAYS:-90}
  # The catalog sandbox: a separate, empty PostgreSQL that answers the tools'
  # questions about tables and columns. Never the source and never the app
  # database. The credential is the account that builds one database per shape
  # of what people may see (needs CREATEDB and membership of the reader role).
  sandboxJdbcUrl: "${GATEWAY_SANDBOX_JDBC_URL:-}"
  sandboxCredentialRef: "${GATEWAY_SANDBOX_CREDENTIAL_REF:-}"
  sandboxReaderRole: "${GATEWAY_SANDBOX_READER_ROLE:-arak_gateway_reader}"

secrets:
  provider: ${SECRETS_PROVIDER:-FERNET}
  fernetKey: "${FERNET_KEY:-}"
  vaultAddress: "${VAULT_ADDR:-}"
  vaultToken: "${VAULT_TOKEN:-}"
